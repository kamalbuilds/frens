<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
.q{position:absolute;left:210px;right:210px;top:310px;opacity:0}
  .q p{font:700 88px/1.1 "SG";letter-spacing:-.025em}
.q p span{opacity:0;display:inline-block;margin-right:.26em;transform:translateY(14px)}
.by{margin-top:40px;font:500 26px "PM";color:var(--muted);display:flex;gap:22px;align-items:center;opacity:0}
.by b{color:var(--accent);font-weight:500}
.rule{position:absolute;left:150px;top:324px;width:6px;height:0;background:var(--accent);border-radius:3px}
.head{position:absolute;left:150px;top:96px;font:500 22px "PM";color:var(--muted);letter-spacing:.14em;opacity:0}
</style>
<div class="head" id="head">ASKED FOR, IN PUBLIC</div>
<div class="rule" id="rule"></div>
<div class="q" id="q1"><p></p><div class="by"><b>@_maki29_</b><span>2026-09-22</span><span>x.com</span></div></div>
<div class="q" id="q2"><p></p><div class="by"><b>@dracian_me</b><span>2026-09-19</span><span>x.com</span></div></div>
<script src="engine.js"></script>
<script>
const Q = { q1: "Social trading on Monad? That's the alpha leak we need.", q2: "copy trading means handing your keys to someone's server and hoping." };
for (const k of ["q1", "q2"]) $("#" + k + " p").innerHTML = Q[k].split(" ").map((w) => `<span>${w}</span>`).join("");
window.render = (t) => {
  $("#head").style.opacity = eo(seg(t, cue("head", 0.1), cue("head", 0.1) + 0.5)) * (1 - seg(t, cue("q1", 1.5) + 0.3, cue("q1", 1.5) + 0.6));
  for (const k of ["q1", "q2"]) {
    const s = cue(k, k === "q1" ? 1.5 : 5.5), e = cue(k + "e", s + 3), root = $("#" + k);
    const words = [...root.querySelectorAll("p span")], n = words.length;
    const show = seg(t, s, s + 0.25) * (1 - seg(t, e + 0.35, e + 0.8));
    root.style.opacity = show;
    words.forEach((w, i) => { const a = eo(seg(t, s + (i / n) * (e - s) * 0.9, s + (i / n) * (e - s) * 0.9 + 0.3)); w.style.opacity = a; w.style.transform = `translateY(${14 * (1 - a)}px)`; });
    const b = root.querySelector(".by"); b.style.opacity = eo(seg(t, e - 0.3, e + 0.2));
  }
  const r = t > cue("q2", 5.5) - 0.2 ? 1 : 0, rr = eo(seg(t, cue("q1", 1.5), cue("q1", 1.5) + 0.4));
  $("#rule").style.height = (rr * 330) + "px"; $("#rule").style.opacity = 1 - seg(t, cue("q2e", 9) + 0.3, cue("q2e", 9) + 0.7);
};
</script>
