<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
.stage{position:absolute;inset:0;perspective:1800px}
.win{position:absolute;left:420px;top:90px;width:760px;height:720px;background:var(--panel);border:1px solid var(--edge);border-radius:14px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.55)}
.hd{height:68px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:14px;padding:0 22px}
.hd .dot{width:34px;height:34px;border-radius:50%;background:var(--raised);border:1px solid var(--edge)}
.hd b{font:600 17px "PS";letter-spacing:.01em}.hd span{color:var(--muted);font-size:13px;margin-left:auto}
.feed{position:absolute;left:0;right:0;top:68px;bottom:0;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
.m{display:flex;gap:12px;align-items:flex-end;opacity:0;transform:translateY(16px)}
.m svg{width:36px;height:36px;flex:none;border-radius:50%}
.bub{background:var(--raised);border:1px solid var(--edge);border-radius:14px 14px 14px 4px;padding:12px 16px;font-size:18px;line-height:1.35;max-width:520px}
.who{font:500 12px "PM";color:var(--muted);margin-bottom:5px}
.pos{width:340px;padding:14px 16px}
.pos .row{display:flex;justify-content:space-between;align-items:center}
.pos .sz{font:500 15px "PM";margin-top:8px;color:var(--muted)}
.pill{font:500 11px "PM";border:1px solid var(--gain);color:var(--gain);border-radius:5px;padding:2px 7px}
.pnl{font:500 22px "PM";color:var(--gain)}
.typing{display:flex;gap:5px;padding:16px 18px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
#order{left:900px;top:130px;width:620px;height:640px;opacity:0}
.fld{margin:22px 26px 0}.fld label{display:block;font:500 12px "PM";color:var(--muted);margin-bottom:8px;letter-spacing:.06em}
.inp{height:52px;border:1px solid var(--edge);border-radius:8px;background:var(--page);display:flex;align-items:center;padding:0 16px;font:500 20px "PM"}
.btn{margin:30px 26px 0;height:54px;border-radius:8px;background:var(--accent);color:var(--page);display:grid;place-items:center;font:700 17px "SG"}
.caret{display:inline-block;width:2px;height:24px;background:var(--ink);margin-left:2px;vertical-align:-5px}
.cap{position:absolute;left:0;right:0;bottom:46px;text-align:center;font:700 44px "SG";letter-spacing:-.02em;opacity:0}
.wall{position:absolute;inset:0;opacity:0}
.wall div{position:absolute;white-space:nowrap;font:400 26px "PS";color:var(--muted)}
</style>
<div class="stage">
  <div class="win" id="chat">
    <div class="hd"><div class="dot"></div><b>perps with the fam</b><span>4 members</span></div>
    <div class="feed">
      <div class="m old" id="o1"><div id="fo1"></div><div><div class="who">bo</div><div class="bub">btc looking strong this morning</div></div></div>
      <div class="m old" id="o2"><div id="fo2"></div><div><div class="who">cy</div><div class="bub">still holding my long, up since the dip</div></div></div>
      <div class="m" id="m1"><div id="f1"></div><div><div class="who">ana</div><div class="bub pos"><div class="row"><span class="pill">LONG</span><span class="pnl">+$16.99</span></div><div class="sz">BTC · 0.0115 · entry 84,887.0</div></div></div></div>
      <div class="m" id="m2"><div id="f2"></div><div><div class="who">dee</div><div class="bub" id="b2"><span class="typing" id="ty" style="display:flex;padding:4px 2px"><i></i><i></i><i></i></span><span id="t2" style="display:none">close at 86k</span></div></div></div>
    </div>
  </div>
  <div class="win" id="order">
    <div class="hd"><div class="dot" style="background:var(--accent);border:0"></div><b>BTC-PERP</b><span>close position</span></div>
    <div class="fld"><label>MARKET</label><div class="inp" id="mk" style="transition:none">BTC-PERP</div></div>
    <div class="fld"><label>SIDE</label><div class="inp">Close long</div></div>
    <div class="fld"><label>LIMIT PRICE</label><div class="inp" id="px"><span id="pxv"></span><span class="caret" id="car"></span></div></div>
    <div class="btn">Place order</div>
  </div>
  <div class="wall" id="wall"></div>
  <div class="cap" id="cap"></div>
</div>
<script src="faces.js"></script>
<script src="engine.js"></script>
<script>
$("#fo1").outerHTML = window.FACES.bo; $("#fo2").outerHTML = window.FACES.cy;
$("#f1").outerHTML = window.FACES.ana.replace("<svg", '<svg id="fa"');
$("#f2").outerHTML = window.FACES.dee.replace("<svg", '<svg id="fb"');
const calls = ["close at 86k", "tp 88k imo", "sell here", "I'd TP at 86.5", "get out above 87", "tp is 85k trust me", "close at 86k", "cut it at 84", "TP 88", "my call was right btw", "who called 87k?", "close it"];
const wall = $("#wall");
calls.forEach((c, i) => { const d = document.createElement("div"); d.textContent = c; d.style.left = ((i * 211) % 1500 + 30) + "px"; d.style.top = (80 + ((i * 97) % 700)) + "px"; d.style.fontSize = (22 + (i % 4) * 8) + "px"; wall.append(d); });
const chat = $("#chat"), order = $("#order");
const px = "86,000";
window.render = (t) => {
  ["o1", "o2"].forEach((k, i) => { const a = eo(seg(t, 0.1 + i * 0.25, 0.5 + i * 0.25)); $("#" + k).style.opacity = 0.55 * a; $("#" + k).style.transform = `translateY(${16 * (1 - a)}px)`; });
  const m1 = seg(t, cue("m1", 0.2), cue("m1", 0.2) + 0.5), m2 = seg(t, cue("m2", 3), cue("m2", 3) + 0.4);
  $("#m1").style.opacity = eo(m1); $("#m1").style.transform = `translateY(${16 * (1 - eo(m1))}px)`;
  const typ = cue("m2", 3) - 0.9;
  $("#m2").style.opacity = eo(seg(t, typ, typ + 0.3)); $("#m2").style.transform = `translateY(${16 * (1 - eo(seg(t, typ, typ + 0.3)))}px)`;
  $("#ty").style.display = t < cue("m2", 3) ? "flex" : "none"; $("#t2").style.display = t < cue("m2", 3) ? "none" : "inline";
  $("#ty").querySelectorAll("i").forEach((e, i) => { e.style.opacity = 0.35 + 0.65 * Math.abs(Math.sin(t * 6 - i * 0.7)); });
  const alt = eio(seg(t, cue("alt", 6), cue("alt", 6) + 0.7));
  chat.style.transform = `translateX(${-340 * alt}px) scale(${1 - 0.1 * alt}) rotateY(${14 * alt}deg)`; chat.style.opacity = 1 - 0.55 * alt;
  const oin = eio(seg(t, cue("alt", 6) + 0.15, cue("alt", 6) + 0.85));
  order.style.opacity = oin; order.style.transform = `translateX(${(1 - oin) * 280}px)`;
  const find = seg(t, cue("find", 7.2), cue("find", 7.2) + 0.4);
  $("#mk").style.borderColor = find > 0 && t < cue("type", 8.4) ? "#C8FF3D" : "";
  const ty = seg(t, cue("type", 8.4), cue("type", 8.4) + 1.1);
  $("#pxv").textContent = px.slice(0, Math.floor(ty * (px.length + 0.999)));
  $("#px").style.borderColor = ty > 0 && ty < 1 ? "#C8FF3D" : "";
  $("#car").style.opacity = (Math.floor(t * 2) % 2 === 0 || ty > 0 && ty < 1) && t < cue("forget", 10.2) ? 1 : 0;
  const fg = eio(seg(t, cue("forget", 10.2), cue("forget", 10.2) + 0.8));
  order.style.filter = `brightness(${1 - 0.7 * fg}) blur(${3 * fg}px)`; order.style.opacity = oin * (1 - 0.35 * fg);
  const nb = eio(seg(t, cue("nobody", 11.5), cue("nobody", 11.5) + 0.8));
  chat.style.opacity = (1 - 0.55 * alt) * (1 - nb); order.style.opacity = oin * (1 - 0.35 * fg) * (1 - nb);
  $("#wall").style.opacity = nb;
  [...$("#wall").children].forEach((d, i) => { d.style.transform = `translateY(${-((t - cue("nobody", 11.5)) * (18 + (i % 5) * 7))}px)`; d.style.opacity = 0.35 + 0.4 * ((i * 7) % 3) / 2; });
  const cp = seg(t, cue("nobody", 11.5) + 0.7, cue("nobody", 11.5) + 1.3);
  $("#cap").textContent = "whose call was any good?"; $("#cap").style.opacity = eo(cp); $("#cap").style.transform = `translateY(${20 * (1 - eo(cp))}px)`;
  $("#cap").style.bottom = "auto"; $("#cap").style.top = "410px";
};
</script>
