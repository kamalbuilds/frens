<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
svg.mark{position:absolute;left:0;top:0;width:900px;height:900px;overflow:visible}
.t{position:absolute;opacity:0}
#word{font:700 150px "SG";letter-spacing:-.04em;left:0;right:0;text-align:center;top:572px}
#tag{font:500 36px "SG";letter-spacing:-.01em;color:var(--muted);left:0;right:0;text-align:center;top:770px}
#url{font:500 26px "PM";color:var(--accent);left:0;right:0;text-align:center;top:830px}
#intro{left:760px;top:330px}
#intro .n{font:700 118px "SG";letter-spacing:-.04em;line-height:1}
#intro .s{font:500 30px "PM";color:var(--muted);margin-top:22px;line-height:1.5}
#intro .s b{color:var(--ink);font-weight:500}
</style>
<svg id="mk" class="mark" viewBox="130 130 860 760"></svg>
<div class="t" id="word">frens</div>
<div class="t" id="tag">Trade perps with your frens.</div>
<div class="t" id="url">frens-eosin.vercel.app</div>
<div class="t" id="intro"><div class="n">Kamal</div><div class="s"><b>@kamalbuilds</b><br>built frens for Perpl traders on Monad<br>Track 03, Social, Attention &amp; Culture</div></div>
<script src="engine.js"></script>
<script>
const mode = cue("mode", "end");
const candles = [[196, 470, 700, 160, 520, 140, "#FF6B57"], [316, 440, 690, 280, 480, 170, "#2BD67B"], [436, 420, 610, 400, 450, 120, "#FF6B57"], [556, 330, 690, 520, 370, 290, "#2BD67B"]];
let h = "";
candles.forEach((c, i) => { h += `<g id="c${i}"><line x1="${c[0]}" y1="${c[1]}" x2="${c[0]}" y2="${c[2]}" stroke="${c[6]}" stroke-width="10" stroke-linecap="round"/><rect x="${c[3]}" y="${c[4]}" width="72" height="${c[5]}" rx="10" fill="${c[6]}"/></g>`; });
h += `<line id="tp" x1="590" y1="250" x2="900" y2="250" stroke="#C8FF3D" stroke-width="12" stroke-dasharray="34 22" stroke-linecap="round"/><rect id="tpend" x="868" y="226" width="56" height="48" rx="10" fill="#C8FF3D"/>`;
h += `<g id="face"><circle cx="556" cy="250" r="96" fill="#0A0A0F"/><circle cx="556" cy="250" r="84" fill="#B98CFF" stroke="#2BD67B" stroke-width="14"/><path d="M488 220 Q556 150 626 214 L626 250 Q560 205 488 252 Z" fill="#8A5CF0" opacity="0.55"/><circle cx="528" cy="246" r="11" fill="#0A0A0F"/><circle cx="586" cy="246" r="11" fill="#0A0A0F"/><path d="M526 282 Q556 308 588 282" fill="none" stroke="#0A0A0F" stroke-width="10" stroke-linecap="round"/></g>`;
h += `<circle id="dot" cx="622" cy="184" r="26" fill="#C8FF3D" stroke="#0A0A0F" stroke-width="10"/>`;
$("#mk").innerHTML = h;
const mkEl = $("#mk");
if (mode === "intro") { mkEl.style.left = "60px"; mkEl.style.top = "80px"; mkEl.style.width = "720px"; mkEl.style.height = "636px"; }
else { mkEl.style.left = "380px"; mkEl.style.top = "20px"; mkEl.style.width = "840px"; mkEl.style.height = "586px"; mkEl.setAttribute("viewBox", "130 110 860 600"); }
const tl = Array.from($("#tp") ? [$("#tp")] : []);
window.render = (t) => {
  candles.forEach((c, i) => {
    const p = eo(seg(t, 0.15 + i * 0.22, 0.15 + i * 0.22 + 0.55));
    const g = $("#c" + i); g.style.transformOrigin = `${c[0]}px 700px`; g.style.transform = `scaleY(${p})`; g.style.opacity = p > 0 ? 1 : 0;
  });
  const f = seg(t, 1.05, 1.6), fe = 1 + 0.35 * Math.sin(Math.PI * f) * (1 - f);
  $("#face").style.transformOrigin = "556px 250px"; $("#face").style.transform = `translateY(${-90 * (1 - eo(f))}px) scale(${fe})`; $("#face").style.opacity = eo(seg(t, 1.05, 1.3));
  const l = eo(seg(t, 1.5, 2.3));
  const tp = $("#tp"); tp.style.strokeDasharray = "34 22"; tp.style.clipPath = `inset(-20px ${100 - l * 100}% -20px 0)`; tp.style.opacity = l > 0 ? 1 : 0;
  $("#tpend").style.opacity = eo(seg(t, 2.05, 2.3)); $("#tpend").style.transformOrigin = "896px 250px"; $("#tpend").style.transform = `scale(${0.5 + 0.5 * eo(seg(t, 2.05, 2.4))})`;
  const d = seg(t, 2.4, 2.8); $("#dot").style.transformOrigin = "622px 184px"; $("#dot").style.transform = `scale(${eo(d) * (1 + 0.5 * Math.sin(Math.PI * d))})`; $("#dot").style.opacity = d > 0 ? 1 : 0;
  if (mode === "intro") {
    const a = eo(seg(t, cue("text", 0.6), cue("text", 0.6) + 0.6));
    $("#intro").style.opacity = a; $("#intro").style.transform = `translateX(${40 * (1 - a)}px)`;
  } else {
    const w = eo(seg(t, cue("word", 2.6), cue("word", 2.6) + 0.5));
    $("#word").style.opacity = w; $("#word").style.transform = `translateY(${26 * (1 - w)}px)`;
    const g = eo(seg(t, cue("tag", 3.2), cue("tag", 3.2) + 0.5));
    $("#tag").style.opacity = g; $("#tag").style.transform = `translateY(${18 * (1 - g)}px)`;
    const u = eo(seg(t, cue("url", 3.9), cue("url", 3.9) + 0.5));
    $("#url").style.opacity = u;
  }
};
</script>
