<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
#num{position:absolute;left:0;right:0;top:170px;text-align:center;font:700 300px/1 "SG";letter-spacing:-.05em;opacity:0}
#lab{position:absolute;left:0;right:0;top:480px;text-align:center;font:500 36px "SG";color:var(--ink);opacity:0}
#src{position:absolute;left:0;right:0;top:540px;text-align:center;font:400 20px "PM";color:var(--muted);opacity:0}
.chips{position:absolute;left:0;right:0;top:0;height:900px}
.chip{position:absolute;left:50%;font:700 64px "SG";letter-spacing:-.02em;border:1px solid var(--edge);background:var(--panel);border-radius:18px;padding:26px 44px;opacity:0;display:flex;gap:22px;align-items:center;white-space:nowrap}
.chip svg{width:64px;height:64px;border-radius:50%}
</style>
<div id="head" style="position:absolute;left:0;right:0;top:130px;text-align:center;font:500 24px PM;letter-spacing:.14em;color:#8B8B9E;opacity:0">TRADERS ALREADY TRADE WITH PEOPLE</div><div id="num">0</div><div id="lab">members in the Perpl Telegram group</div><div id="src">t.me/perplTradeOfficialtg, read 2026-10-02</div>
<div class="chips"><div class="chip" id="c1">a group chat</div><div class="chip" id="c2">a calls channel</div><div class="chip" id="c3"><span id="fx"></span>a fren who tails them</div></div>
<script src="faces.js"></script><script src="engine.js"></script>
<script>
$("#fx").outerHTML = window.FACES.cy;
window.render = (t) => {
  const c = [cue("c1", 0.4), cue("c2", 1.9), cue("c3", 3.4)], n0 = cue("num", 6);
  const m = eio(seg(t, n0 - 0.4, n0 + 0.5));
  [1, 2, 3].forEach((i) => {
    const e = $("#c" + i), a = eo(seg(t, c[i - 1], c[i - 1] + 0.45));
    const w = e.offsetWidth;
    const y0 = 250 + (i - 1) * 150, y1 = 706;
    const x1 = 800 + (i - 2) * 520;
    const sc = 1 - 0.55 * m;
    e.style.left = "0px";
    e.style.top = (y0 + (y1 - y0) * m) + "px";
    e.style.transform = `translate(${800 - w / 2 + (x1 - 800) * m}px, ${(1 - a) * 24}px) scale(${sc})`;
    e.style.transformOrigin = "50% 0";
    e.style.opacity = a * (1 - 0.35 * m);
  });
  $("#head").style.opacity = eo(seg(t, 0.2, 0.7)) * (1 - eo(seg(t, n0 - 0.4, n0 + 0.2)));
  const a = eo(seg(t, n0, n0 + 0.4)); $("#num").style.opacity = a; $("#num").style.transform = `scale(${0.96 + 0.04 * a})`;
  $("#num").textContent = Math.round(10131 * eo(seg(t, n0, n0 + 1.6))).toLocaleString("en-US");
  $("#lab").style.opacity = eo(seg(t, n0 + 0.5, n0 + 1)); $("#src").style.opacity = eo(seg(t, n0 + 0.8, n0 + 1.3)) * 0.9;
};
</script>
